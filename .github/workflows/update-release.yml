name: Update FQLite download links

# Keeps the download table in README.md pointing at the latest FQLite release.
# Runs daily, on manual start, and when FQLite sends a repository_dispatch
# event of type "fqlite-release" (optional, see docs/maintainers.md).
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [fqlite-release]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate download table
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_release.py
      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "No change."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update download links to latest FQLite release"
          git push
